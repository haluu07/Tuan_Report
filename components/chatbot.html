  <!-- ========================================================
       9. KHUNG CHATBOT TỰ ĐỘNG (FLOATING CHAT WIDGET)
       ======================================================== -->
  <aside class="chat-widget" id="chatWidget" aria-label="Trợ lý ảo KT Xanh Thái Nguyên">
    
    <!-- Cửa sổ Chatbot -->
    <div class="chat-window" id="chatWindow" aria-hidden="true">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="chat-bot-avatar">
          <img src="assets/logo-kt-xanh.png" alt="KT Xanh Bot" width="34" height="34" class="chat-avatar-img">
          <span class="chat-status-indicator" title="Đang trực tuyến"></span>
        </div>
        <div class="chat-bot-info">
          <h4 class="chat-bot-name">Trợ lý Kỹ Thuật KT Xanh</h4>
          <span class="chat-bot-status">Sẵn sàng phản hồi 24/7</span>
        </div>
        <button class="chat-close-btn" id="chatCloseBtn" aria-label="Thu nhỏ chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Khung hiển thị nội dung tin nhắn -->
      <div class="chat-body" id="chatMessages">
        <!-- Tin nhắn chào mừng ban đầu do script sinh ra -->
      </div>

      <!-- Khu vực gợi ý câu hỏi nhanh (Quick Question Chips) -->
      <div class="chat-quick-replies" id="chatQuickReplies">
        <span class="quick-reply-label">Gợi ý câu hỏi nhanh:</span>
        <div class="quick-chips-wrap">
          <button type="button" class="quick-chip" data-question="Báo giá khảo sát địa chất">
            Báo giá khảo sát địa chất?
          </button>
          <button type="button" class="quick-chip" data-question="Quy trình thẩm tra dự toán">
            Quy trình thẩm tra dự toán?
          </button>
          <button type="button" class="quick-chip" data-question="Tư vấn trạm 110kV">
            Tư vấn trạm 110kV?
          </button>
          <button type="button" class="quick-chip" data-question="Tôi muốn đặt lịch khảo sát hiện trường ngay">
            Đặt lịch khảo sát hiện trường?
          </button>
        </div>
      </div>

      <!-- Ô nhập tin nhắn và nút gửi -->
      <form class="chat-footer" id="chatForm">
        <input 
          type="text" 
          id="chatInput" 
          class="chat-input" 
          placeholder="Nhập câu hỏi của bạn tại đây..." 
          autocomplete="off"
        >
        <button type="submit" class="chat-send-btn" id="chatSendBtn" aria-label="Gửi tin nhắn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>

    <!-- Nút Chat Zalo Nhanh (Nằm ngay trên icon Chatbot) -->
    <a href="https://zalo.me/0988123456" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="zalo-floating-btn" 
       id="zaloFloatingBtn" 
       title="Chat Zalo ngay: 0988.123.456"
       aria-label="Liên hệ Zalo với kỹ sư KT Xanh">
      <div class="zalo-icon-wrap">
        <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#ffffff">
          <title>Zalo</title>
          <path d="M12.49 10.272v-.45h1.347v6.322h-.77a.576.576 0 0 1-.577-.573v.001a3.27 3.27 0 0 1-1.938.632a3.284 3.284 0 0 1-3.284-3.282a3.284 3.284 0 0 1 3.284-3.282a3.27 3.27 0 0 1 1.937.632zM6.919 7.79v.205c0 .382-.051.694-.3 1.06l-.03.034a8 8 0 0 0-.242.285L2.024 14.8h4.895v.768a.576.576 0 0 1-.577.576H0v-.362c0-.443.11-.641.25-.847L4.858 9.23H.192V7.79zm8.551 8.354a.48.48 0 0 1-.48-.48V7.79h1.441v8.354zM20.693 9.6a3.306 3.306 0 1 1 .002 6.612a3.306 3.306 0 0 1-.002-6.612m-10.14 5.253a1.932 1.932 0 1 0 0-3.863a1.932 1.932 0 0 0 0 3.863m10.14-.003a1.945 1.945 0 1 0 0-3.89a1.945 1.945 0 0 0 0 3.89"/>
        </svg>
      </div>
      <span class="zalo-pulse-ring" aria-hidden="true"></span>
      <span class="zalo-tooltip">Tư vấn Zalo: 0988.123.456</span>
    </a>

    <!-- Nút Floating Toggle mở/đóng Chatbot -->
    <button class="chat-toggle-btn" id="chatToggleBtn" aria-label="Mở cửa sổ trợ lý ảo KT Xanh">
      <div class="chat-toggle-icon chat-icon-open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="chat-badge-pulse" aria-hidden="true"></span>
      </div>
      <div class="chat-toggle-icon chat-icon-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    </button>
  </aside>
